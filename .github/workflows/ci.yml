name: Docker CI

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose environments
        run: |
          ENVIRONMENT=dev ./scripts/compose-branch.sh config --quiet
          ENVIRONMENT=test ./scripts/compose-branch.sh config --quiet
          ENVIRONMENT=prod ENV_FILE=config/.env.prod.example ./scripts/compose-branch.sh config --quiet

      - name: Run tests in Docker
        run: make test

      - name: Show Docker logs after failure
        if: failure()
        run: ENVIRONMENT=test ./scripts/compose-branch.sh logs --no-color

      - name: Clean up test environment
        if: always()
        run: ENVIRONMENT=test ./scripts/compose-branch.sh down --volumes --remove-orphans

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production images
        run: |
          docker build -t cost-detective-api:ci ./apps/api
          docker build -t cost-detective-web:ci ./apps/dashboard

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        image:
          - name: api
            context: ./apps/api
          - name: web
            context: ./apps/dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
