name: Build and Push Docker Images

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API Image
        run: docker build -t ghcr.io/${{ github.repository }}/api:latest ./apps/api

      - name: Build Web Image
        run: docker build -t ghcr.io/${{ github.repository }}/web:latest ./apps/dashboard

      - name: Push API Image
        run: docker push ghcr.io/${{ github.repository }}/api:latest

      - name: Push Web Image
        run: docker push ghcr.io/${{ github.repository }}/web:latest