services:
  api:
    build: ./apps/api
    container_name: cd-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATA_MODE=${DATA_MODE}
      - NAMESPACE=${NAMESPACE}
    depends_on:
      - db
    security_opt:
      - no-new-privileges:true

  web:
    build: ./apps/dashboard
    container_name: cd-web
    ports:
      - "3000:3000"
    environment:
      - KUBECONFIG=/home/appuser/.kube/config
      - NEXT_PUBLIC_API_URL=http://api:8000
    volumes:
      - ~/.kube/config-docker:/home/appuser/.kube/config:ro
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16
    container_name: cd-db
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
